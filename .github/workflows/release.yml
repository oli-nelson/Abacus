name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.3 or 1.3.0-rc.1'
        required: true
        type: string
      expected_sha:
        description: 'Optional source SHA guard (supplied by the local helper)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: abacus-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # Read-only credentials allow tag checks in private repositories too.
          persist-credentials: true
      - id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          [[ "$RELEASE_REF_TYPE" == branch ]] || { echo 'error: select a branch, not a tag'; exit 1; }
          source scripts/release-version.sh
          version=$(release_version "$RELEASE_VERSION")
          [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" == "$SOURCE_SHA" ]] || { echo 'error: source changed before dispatch; request a fresh run'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          # Check before spending build minutes; finalization checks again.
          remote_tag=$(git ls-remote --tags origin "refs/tags/v$version")
          [[ -z "$remote_tag" ]] || { echo 'error: version tag already exists; use same-run failed-job retry or choose a new version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/release-input
          # Preview only: tracked CHANGELOG.md stays untouched until tests pass.
          bash scripts/release-changelog.sh "$version" CHANGELOG.md > artifacts/release-input/CHANGELOG.md
          awk -v version="$version" '
            /^## / {
              if (index($0, "## [" version "] - ") == 1) {
                found++; section = 1; next
              }
              section = 0
            }
            section { print }
            END { if (found != 1) exit 1 }
          ' artifacts/release-input/CHANGELOG.md > artifacts/release-input/release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: abacus-release-input
          path: artifacts/release-input/*
          if-no-files-found: error

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Test release scripts
        run: bash scripts/test-release.sh
      - name: Test
        run: dotnet test Abacus.sln --configuration Release
      - name: Package and verify embedded version
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_RID: ${{ matrix.rid }}
        run: bash scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_RID"
      - uses: actions/upload-artifact@v6
        with:
          name: abacus-${{ matrix.rid }}
          path: artifacts/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          # Only this gated job needs credentials for the changelog/tag push.
          persist-credentials: true
      - uses: actions/download-artifact@v7
        with:
          pattern: abacus-*
          path: artifacts/release
          merge-multiple: true
      - name: Finalize changelog, tag, and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: bash scripts/finalize-release.sh "$RELEASE_VERSION" "$RELEASE_BRANCH" "$SOURCE_SHA" artifacts/release
